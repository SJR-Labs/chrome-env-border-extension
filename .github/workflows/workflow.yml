name: Release WebApp Build

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  ZIP_NAME: chrome-env-border-extension

jobs:
  build-and-upload:
    if: github.event.release.target_commitish == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create ZIP
        run: zip -r ${{ env.ZIP_NAME}}-${{ github.ref_name }}.zip dist/

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" ${{ env.ZIP_NAME}}-${{ github.ref_name }}.zip --clobber